# 合并 PR 前的 CI 检查
# 前端（client，Node + TS）与网关（gateway + tsproto，Kotlin + Gradle）并行构建。
# 在仓库 Settings → Branches → Branch protection rules 里把下面两个 job
# （"Client (Lint + 类型检查 + 构建)" 与 "Gateway (编译 + 测试)"）勾为 required status checks，
# 未通过就无法合并 PR。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支的新推送取消上一次未完成的检查，节省额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: Client (Lint + 类型检查 + 构建)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 代码检查 (ESLint)
        run: npm run lint

      - name: 类型检查 + 生产构建
        run: npm run build

  gateway:
    name: Gateway (编译 + 测试)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: 编译网关并运行测试
        run: |
          chmod +x gradlew
          ./gradlew -p gateway build --no-daemon --console=plain
